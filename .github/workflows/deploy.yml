name: Deploy

on:
  push:
    branches: [master]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Connect and list changes without uploading anything'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.127.0'
          extended: true

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }
          echo "Built $(find public -type f | wc -l) files, $(du -sh public | cut -f1)"

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: ./miguelsolorio/
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.htaccess
            **/.well-known/**
            cgi-bin/**
          timeout: 600000
          log-level: minimal
