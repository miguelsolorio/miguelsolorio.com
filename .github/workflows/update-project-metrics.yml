name: Update project metrics

on:
  schedule:
    - cron: "17 15 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Visual Studio Marketplace metrics
        run: npm run update:metrics
      - name: Refresh Codicons downloads and dependents
        run: npm run update:codicons
      - name: Commit updated metrics
        id: commit
        env:
          TRACKED: >-
            data/project_metrics.json
            data/hire_me_series.json
            data/codicons_stats.json
            data/hire_me.yaml
            content/icons.md
            static/icons/npm-downloads.js
            static/icons/npm-downloads.html
        run: |
          if git diff --quiet -- $TRACKED; then
            echo "Project metrics are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "Update project metrics"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
