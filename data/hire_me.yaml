chapters:
  - id: vscode
    tint: "#2f7fd9"
    years: 2018 to 2022
    org: Microsoft
    role: Principal designer, VS Code
    title: Designed VS Code in the open
    stats:
      - { total_of: npm, label: Codicons downloads }
      - { contrib_total: prs, label: Pull requests }
      - { contrib_total: commits, label: Commits }
    links:
      - { label: Onboarding case study, href: /onboarding/ }
      - { label: Icons case study, href: /icons/ }
      - { label: Config 2020 talk, href: "https://www.youtube.com/watch?v=yZUZk9B-PlE", external: true }
    blocks:
      - kind: area
        series: npm
        title: Launched Codicons, VS Code's icon library
        text: Open sourced icon library, which led to product icon themes that let any extension replace VS Code's icons
        caption: Weekly npm downloads of Codicons
        grid:
          - { value: 500000, label: 500k }
        marks:
          - { index: 40, label: 20k a week after a year, align: start, place: above }
          - { index: -1, label: "{value}", align: end, place: above }
        mini:
          - { source: total, label: Downloads all time }
          - { source: recent, label: Downloads in four weeks }
          - { value: 976, label: Projects using it }
      - kind: quotes
        note: On the new product icons
        ids: [marius, antfu]
      - kind: contrib
        title: Contributions on GitHub
        total_noun: contributions
        summary: Commits, pull requests, issues, and reviews on GitHub from 2018 to 2022, across microsoft/vscode and 31 other Microsoft repositories, excluding merge commits
        series:
          - { key: commits, label: Commits }
          - { key: prs, label: Pull requests }
          - { key: issues, label: Issues }
          - { key: reviews, label: Reviews }
        rows:
          - { label: "2018", commits: 144, prs: 38, issues: 65, reviews: 4 }
          - { label: "2019", commits: 605, prs: 76, issues: 113, reviews: 8 }
          - { label: "2020", commits: 390, prs: 29, issues: 184, reviews: 11 }
          - { label: "2021", commits: 437, prs: 28, issues: 188, reviews: 13 }
          - { label: "2022", commits: 84, prs: 30, issues: 138, reviews: 18 }
      - kind: quotes
        note: On first run
        ids: [nonameolsson, ntotten]

  - id: gemini-cli
    tint: "#5b7fc7"
    years: "2025"
    org: Google
    role: Lead designer, Gemini CLI
    title: Designed for the first open-sourced terminal agent
    stats:
      - { value: "72", suffix: k, label: GitHub stars in ten weeks }
      - { contrib_total: prs, label: Pull requests }
      - { contrib_total: issues, label: Issues }
    links:
      - { label: Gemini CLI case study, href: /cli-agents/ }
    blocks:
      - kind: embed
        src: /cli-agents/cli-todo-animation.html
        title: Gemini CLI reading a research plan, writing a grouped four-step todo list, and completing each task with its matching tool call
        caption: The agent works through a grouped todo list, one visible tool call at a time
        height: 600
        width: 752
        min_height: 28rem
      - kind: contrib
        title: Contributions on GitHub
        total_noun: contributions
        summary: Commits, pull requests, issues, and reviews on google-gemini/gemini-cli by month, excluding merge commits
        series:
          - { key: commits, label: Commits }
          - { key: prs, label: Pull requests }
          - { key: issues, label: Issues }
          - { key: reviews, label: Reviews }
        rows:
          - { label: May 2025, commits: 14, prs: 12, issues: 0, reviews: 1 }
          - { label: Jun 2025, commits: 7, prs: 9, issues: 0, reviews: 3 }
          - { label: Jul 2025, commits: 6, prs: 7, issues: 7, reviews: 1 }
          - { label: Aug 2025, commits: 4, prs: 11, issues: 5, reviews: 5 }
          - { label: Sep 2025, commits: 10, prs: 16, issues: 9, reviews: 6 }
          - { label: Oct 2025, commits: 3, prs: 4, issues: 0, reviews: 6 }
          - { label: After Oct 2025, commits: 0, prs: 0, issues: 1, reviews: 2 }
      - kind: quotes
        ids: [taylor, tyler, yogesh, jgang, riccardo, jukka]

  - id: colab
    tint: "#f29900"
    years: 2024 to now
    org: Google
    role: Lead designer, Google Colab
    title: Re-designed Colab as an AI-first product
    stats:
      - { value: "4.9", suffix: x, label: Increase in user efficiency }
      - { value: "82", suffix: "%", label: User satisfaction }
    links:
      - { label: Colab case study, href: /colab-notebooks/ }
    blocks:
      - kind: embed
        src: /colab-notebooks/cell-animation.html
        title: An animated prototype of Gemini generating cells in a Colab notebook
        caption: A coded prototype of Gemini generating notebook cells
        height: 710
        width: 752
        min_height: 44rem
      - kind: pairs
        title: Time to finish a task
        text: Participants finished all four tasks faster, and sentiment analysis dropped from 26 minutes to four.
        caption: Mean task completion time in a usability study
        with_label: With Gemini
        without_label: Without
        rows:
          - { label: Code generation, with: 167, without: 617 }
          - { label: Error resolution, with: 84, without: 513 }
          - { label: Data visualization, with: 191, without: 517 }
          - { label: Sentiment analysis, with: 245, without: 1574 }
      - kind: quotes
        note: From users after the redesign
        ids: [gpucpp, yajush, ladi]
      - kind: quotes
        note: From teammates on the project
        ids: [mahi, chris, mahi2]

  - id: meta
    tint: "#7a5af8"
    years: 2022 to 2023
    org: Meta
    role: Design system lead, Meta
    title: Led the design system team
    stats:
      - { value: "123", suffix: "", label: Components in the library }
      - { value: "75", suffix: "%", label: "Refreshed, up from 26%" }
    links:
      - { label: Kanvas case study, href: /kustomer-design-system/ }
    blocks:
      - kind: shift
        title: Component health, before and after
        text: The design team stopped wondering whether a component was out of date, and handoff improved.
        caption: Share of the library by status
        rows:
          - { label: Refreshed, from: 26, to: 75 }
          - { label: Stale, from: 33, to: 5 }
          - { label: Missing, from: 41, to: 17 }
      - kind: quotes
        ids: [lina, alex, bree, julio]

