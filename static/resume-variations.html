  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink-700);
    background: linear-gradient(180deg, #f2f0ff 0%, #f8f7ff 45%, #f5f5f5 100%) fixed;
    -webkit-font-smoothing: antialiased;
  }

  /* Site grain over the ambient wash */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .11;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    mix-blend-mode: soft-light;
  }

  /* ---- Lab chrome ------------------------------------------- */

  .lab-nav {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: .875rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: .5rem .75rem;
    background: rgba(245, 245, 245, .78);
    border-bottom: 1px solid var(--hairline);
    box-shadow: 0 1px 12px rgb(var(--shadow-rgb) / .06);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    backdrop-filter: blur(12px) saturate(180%);
  }

  .lab-title {
    font-weight: 700;
    letter-spacing: -.035em;
    color: var(--ink-900);
    font-size: .9375rem;
    margin-right: .5rem;
    white-space: nowrap;
  }
  .lab-title span { color: var(--primary); }

  .lab-nav a.chip {
    font-family: var(--mono);
    font-size: .6875rem;
    line-height: 1;
    padding: .4375rem .625rem;
    border-radius: .375rem;
    color: var(--ink-700);
    background: rgba(255, 255, 255, .7);
    box-shadow: 0 0 0 1px rgb(var(--shadow-rgb) / .07);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .lab-nav a.chip b { color: var(--primary); font-weight: 700; }
  .lab-nav a.chip:hover { background: var(--primary); color: #fff; }
  .lab-nav a.chip:hover b { color: #fff; }

  .lab-main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 3rem 1.5rem 6rem;
  }

  .variation { scroll-margin-top: 5.5rem; }

  .variation-label {
    width: 816px;
    max-width: 100%;
    margin: 2.5rem 0 .75rem;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--ink-500);
  }
  .variation:first-of-type .variation-label { margin-top: 0; }
  .variation-label b { color: var(--primary); font-weight: 700; margin-right: .5em; }
  .variation-label span { color: var(--ink-400); }

  /* ---- Sheet base (US Letter, 816 × 1056 @ 96dpi) ------------ */

  .sheet {
    position: relative;
    width: 816px;
    height: 1056px;
    max-width: 100%;
    overflow: hidden;
    background: #fff;
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgb(var(--shadow-rgb) / .07),
      0 16px 32px -12px rgb(var(--shadow-rgb) / .15);
  }

  .sheet a { color: inherit; text-decoration: none; }

  /* Avatar — one embedded headshot, sized per variation */
  .avatar {
    display: block;
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background-image: var(--avatar);
    background-size: cover;
    background-position: center;
  }

  /* ============================================================
     V1 — Site Classic
     ============================================================ */
  .v1.sheet { padding: 58px 64px; }

  .v1 h1 {
    margin: 0;
    color: var(--primary);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -.035em;
    line-height: 1;
  }
  .v1 .loc { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-500); }
  .v1 .contact { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-500); }
  .v1 .contact a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
  }
  .v1 .contact .sep { color: var(--ink-400); margin: 0 6px; }

  .v1 header.who { display: flex; align-items: center; gap: 20px; }
  .v1 .avatar {
    width: 72px;
    height: 72px;
    box-shadow: 0 0 0 1px rgb(var(--shadow-rgb) / .1), 0 8px 24px rgb(var(--shadow-rgb) / .12);
  }

  .v1 h2 {
    margin: 26px 0 4px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .v1 .company { padding: 15px 0 12px; }
  .v1 .company + .company { border-top: 1px solid var(--hairline); }
  .v1 h3 { margin: 0 0 1px; font-size: 14.5px; font-weight: 700; color: var(--ink-900); letter-spacing: -.01em; }
  .v1 .role { display: flex; align-items: baseline; gap: 10px; padding: 2.5px 0; }
  .v1 .role .t { font-size: 12.5px; color: var(--ink-700); }
  .v1 .role .dots { flex: 1; border-bottom: 1px dotted transparent; }
  .v1 .role .d { font-size: 11.5px; color: var(--ink-500); white-space: nowrap; }
  .v1 .role .dur { font-size: 11.5px; color: var(--ink-400); white-space: nowrap; }

  /* ============================================================
     V2 — Ambient Wash
     ============================================================ */
  .v2.sheet { padding: 0; }

  .v2 .wash {
    position: relative;
    padding: 54px 64px 30px;
    background: linear-gradient(180deg, #eeebff 0%, #f6f4ff 70%, #ffffff 100%);
    overflow: hidden;
  }
  .v2 .wash::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(420px 200px at 18% -30%, rgba(52, 41, 255, .13), transparent 70%),
      radial-gradient(420px 220px at 85% -20%, rgba(239, 169, 174, .22), transparent 70%);
  }
  /* No grain overlay here, unlike the site: mix-blend-mode forces Chrome to
     rasterize the whole band at print DPI, which took the exported PDF from
     170KB to 3.4MB. The gradient alone costs nothing. */
  .v2 .wash > * { position: relative; z-index: 1; }

  .v2 .who { display: flex; align-items: flex-start; gap: 24px; }
  .v2 .avatar {
    width: 92px;
    height: 92px;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .8), 0 16px 32px -12px rgb(var(--shadow-rgb) / .3);
  }

  .v2 h1 {
    margin: 0;
    color: var(--ink-900);
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -.05em;
    line-height: .98;
  }
  .v2 h1 em { font-style: normal; }
  .v2 .loc { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-500); }
  .v2 .chips { display: flex; gap: 8px; margin-top: 10px; }
  .v2 .chips a {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 5px 9px;
    border-radius: 99px;
    color: var(--primary-ink);
    background: rgba(255, 255, 255, .72);
    box-shadow: 0 0 0 1px rgba(52, 41, 255, .16);
  }

  .v2 .body { padding: 8px 64px 56px; }
  .v2 h2 {
    margin: 22px 0 6px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .v2 .company { padding: 14px 0 11px; }
  .v2 .company + .company { border-top: 1px solid var(--hairline); }
  .v2 h3 { margin: 0 0 1px; font-size: 14px; font-weight: 700; color: var(--ink-900); letter-spacing: -.01em; }
  /* Dates sit inline after the title rather than right-aligned in their own
     column. A right-aligned column is the nicer typography, but PDF text
     extraction reads it as a separate block: every applicant tracking system

variations.forEach((v, i) => {

    <p class="variation-label"><b>V${n}</b>${v.name} <span>— ${v.note}</span></p>
    <article class="sheet ${v.id}" aria-label="Resume variation ${n}: ${v.name}">${v.html()}</article>`;
  lab.appendChild(wrap);

  const chip = document.createElement("a");
  chip.className = "chip";
  chip.href = `#${v.id}`;
  chip.innerHTML = `<b>V${n}</b> ${v.name}`;
  chips.appendChild(chip);
