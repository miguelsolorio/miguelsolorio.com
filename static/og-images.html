<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>OG image lab · miguelsolorio.com</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------
       OG image lab. Ten 1200×630 share-card directions built from the
       site's own tokens: the blurple + slate light theme, Rosé Dusk dark,
       Inter display type, JetBrains Mono terminal chrome, and the
       topography shader ported from assets/js/common.js. Each card is a
       real 1200×630 DOM canvas scaled down for preview, so the winning
       one can be captured 1:1 as static/og-image.png.
       ------------------------------------------------------------------ */

    * { box-sizing: border-box; }

    :root {
      /* Lab chrome shadows: the site's light shadow ink (main.css). */
      --lab-ring: 0 0 0 1px rgb(35 28 102 / .07);
      --lab-md: 0 8px 24px rgb(35 28 102 / .1);
    }

    body {
      margin: 0;
      background-color: #f5f5f5;
      background-image: linear-gradient(180deg, #f2f0ff 0%, #f8f7ff 45%, #f5f5f5 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #475569;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

    /* Lab chrome */

    .lab {
      max-width: 1400px;
      margin: 0 auto;
      padding: 56px 40px 120px;
    }

    .lab-head h1 {
      margin: 0;
      color: #0f172a;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .lab-sub {
      max-width: 70ch;
      margin: 14px 0 0;
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
    }

    .lab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr));
      gap: 44px 36px;
      margin-top: 44px;
    }

    .slot { margin: 0; }

    .og-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1200 / 630;
      border-radius: 14px;
      box-shadow: var(--lab-ring), var(--lab-md);
      cursor: zoom-in;
    }

    .og-frame:focus-visible {
      outline: 2px solid #3429ff;
      outline-offset: 3px;
    }

    figcaption {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      margin-top: 14px;
    }

    .cap-n { color: #241bc7; font: 500 13px/1 'JetBrains Mono', monospace; }
    .cap-name { color: #0f172a; font-size: 16px; font-weight: 600; }

    .cap-tag {
      padding: 3px 10px;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      color: #64748b;
      font: 500 11px/1.2 'JetBrains Mono', monospace;
    }

    .cap-tag.dark {
      border-color: transparent;
      background: #161221;
      color: #cec6de;
    }

    .cap-note {
      width: 100%;
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ------------------------------------------------------------------
       The cards. Every .og is a fixed 1200×630 canvas; the frame scales
       it to fit. Ambient + grain mirror .site-ambient in main.css, and
       the shader render below replaces the gradient when WebGL is up.
       ------------------------------------------------------------------ */

    .og {
      position: absolute;
      top: 0;
      left: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      transform-origin: 0 0;
      -webkit-font-smoothing: antialiased;
    }

    .og-ambient {
      position: absolute;
      inset: 0;
      background-size: 100% 100%;
    }

    .theme-light .og-ambient {
      background-color: #f5f5f5;
      background-image: linear-gradient(180deg, #f2f0ff 0%, #f8f7ff 45%, #f5f5f5 100%);
    }

    .theme-dark .og-ambient {
      background-color: #110e1a;
      background-image: linear-gradient(180deg, #161320 0%, #1a1626 48%, #110e1a 100%);
    }

    .og-grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: .11;
      mix-blend-mode: soft-light;
    }

    .theme-dark .og-grain {
      opacity: .15;
      mix-blend-mode: overlay;
    }

    .og-content {
      position: relative;
      height: 100%;
    }

    /* Shared theme tokens (hero.css / dark.css / main.css values). */

    .theme-light {
      --ps1: #15803d;
      --caret: #15803d;
      --ring: 0 0 0 1px rgb(35 28 102 / .07);
      --md: 0 8px 24px rgb(35 28 102 / .1);
      --xl: 0 24px 64px -16px rgb(35 28 102 / .15);
      --term-bg: #ffffff;
      --term-bar: #f1f5f9;
      --term-line: rgba(15, 23, 42, .12);
      --term-dim: #94a3b8;
      --term-text: #475569;
      --term-bright: #0f172a;
      --term-light: #cbd5e1;
      --t-added: #15803d;
      --t-modified: #b45309;
    }

    .theme-dark {
      --ps1: #95d5a5;
      --caret: #95d5a5;
      --ring: 0 0 0 1px rgb(210 202 222 / .12);
      --md: 0 8px 24px rgb(56 39 51 / .45);
      --xl: 0 24px 64px -16px rgb(56 39 51 / .55);
      --term-bg: #161221;
      --term-bar: #221c32;
      --term-line: rgba(210, 202, 222, .15);
      --term-dim: #7e7599;
      --term-text: #cec6de;
      --term-bright: #f5f0fa;
      --term-light: #453c5c;
      --t-added: #95d5a5;
      --t-modified: #f6c177;
    }

    .ps1 { color: var(--ps1); }

    .caret {
      display: inline-block;
      width: .55em;
      height: 1.15em;
      margin-left: .12em;
      background: var(--caret);
      vertical-align: -.18em;
    }

    /* 01 + 02 · Hero */

    .og-hero {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 84px;
    }

    .hero-top {
      margin: 0;
      color: #64748b;
      font: 500 24px/1 'JetBrains Mono', monospace;
    }

    .hero-h {
      margin: 0;
      color: #3429ff;
      font-size: 118px;
      font-weight: 700;
      letter-spacing: -.06em;
      line-height: .96;
    }

    .hero-foot {
      margin: 0;
      color: #0f172a;
      font-size: 30px;
      font-weight: 600;
    }

    .hero-foot .role {
      color: #64748b;
      font-weight: 500;
    }

    .theme-dark .hero-top { color: #7e7599; }
    .theme-dark .hero-h { color: #efa9ae; }
    .theme-dark .hero-foot { color: #ede7f2; }
    .theme-dark .hero-foot .role { color: #8c839f; }

    /* 03 + 04 · Terminal (hero.css window, scaled up) */

    .og-center {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 60px;
    }

    .term {
      width: 900px;
      overflow: hidden;
      border: 1px solid var(--term-line);
      border-radius: 14px;
      background: var(--term-bg);
      background: color-mix(in srgb, var(--term-bg) 70%, transparent);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: var(--ring), var(--xl);
    }

    .term-bar {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
      height: 58px;
      padding: 0 20px;
      border-bottom: 1px solid var(--term-line);
      background: var(--term-bar);
      background: color-mix(in srgb, var(--term-bar) 65%, transparent);
    }

    .term-lights { display: flex; gap: 9px; }

    .term-lights i {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--term-light);
    }

    .term-title {
      overflow: hidden;
      color: var(--term-dim);
      font: 500 20px/1 'JetBrains Mono', monospace;
      text-align: center;
    }

    .term-body {
      padding: 36px 44px 40px;
      color: var(--term-text);
      font: 500 26px/1.6 'JetBrains Mono', monospace;
    }

    .t-row { margin: 0; white-space: pre; }
    .t-row + .t-row { margin-top: 4px; }
    .t-row.spaced { margin-top: 24px; }
    .t-cmd { color: var(--term-bright); }
    .t-dim { color: var(--term-dim); }
    .t-added { color: var(--t-added); }
    .t-modified { color: var(--t-modified); }

    /* 05 · Photo split */

    .og-split {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 64px;
      align-items: center;
      height: 100%;
      padding: 84px;
    }

    .split-eyebrow {
      margin: 0;
      color: #241bc7;
      font: 500 22px/1 'JetBrains Mono', monospace;
    }

    .split-name {
      max-width: 460px;
      margin: 16px 0 0;
      color: #3429ff;
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: .94;
    }

    .split-role {
      margin: 22px 0 0;
      color: #64748b;
      font-size: 30px;
      font-weight: 500;
    }

    .split-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 40px 0 0;
    }

    .split-chips span {
      padding: 10px 18px;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .6);
      color: #475569;
      font: 500 19px/1 'JetBrains Mono', monospace;
    }

    .split-photo {
      width: 400px;
      height: 466px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: var(--ring), var(--xl);
    }

    /* 06 · Command palette (command-palette.css panel) */

    .og-cmdk {
      position: relative;
      display: grid;
      place-items: center;
      height: 100%;
    }

    .cmdk-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .2);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    .cmdk {
      position: relative;
      width: 680px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      background: color-mix(in srgb, #ffffff 92%, transparent);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      box-shadow: var(--ring), var(--md), var(--xl);
    }

    .cmdk-input {
      padding: 26px 30px;
      border-bottom: 1px solid #f1f5f9;
      color: #1e293b;
      font-size: 28px;
    }

    .cmdk-caret {
      display: inline-block;
      width: 3px;
      height: 32px;
      margin-left: 3px;
      background: #3429ff;
      vertical-align: -5px;
    }

    .cmdk-cat {
      margin: 0;
      padding: 20px 30px 8px;
      color: #c8d2dc;
      font-size: 17px;
      font-weight: 600;
    }

    .cmdk-results { padding-bottom: 14px; }

    .cmdk-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 14px;
      padding: 14px 16px;
      border-radius: 9px;
      color: #334155;
      font-size: 26px;
      font-weight: 500;
    }

    .cmdk-row.active { background: #ede9fe; }

    .cmdk-row svg {
      width: 30px;
      height: 30px;
      color: #64748b;
      flex-shrink: 0;
    }

    .cmdk-ico-img {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .cmdk-foot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 26px;
      border-top: 1px solid #f1f5f9;
    }

    .cmdk-dot {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: #3429ff;
    }

    .cmdk-site { color: #94a3b8; font: 500 16px/1 'JetBrains Mono', monospace; }

    .cmdk-action {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      color: #64748b;
      font-size: 17px;
      font-weight: 500;
    }

    .cmdk-action kbd {
      padding: 3px 9px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      color: #64748b;
      font: 500 14px/1.4 'JetBrains Mono', monospace;
    }

    /* 07 · Metrics (side-project card chips, Rosé Dusk) */

    .og-metrics {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 84px;
    }

    .met-top {
      margin: 0;
      color: #8c839f;
      font-size: 26px;
      font-weight: 500;
    }

    .met-top b { color: #ede7f2; font-weight: 600; }

    .met-big {
      margin: 0;
      color: #efa9ae;
      font-size: 200px;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: .9;
    }

    .met-sub {
      margin: 22px 0 0;
      color: #a79fb8;
      font-size: 31px;
    }

    .met-chips { display: flex; gap: 14px; }

    .met-chips span {
      padding: 15px 21px;
      border: 1px solid #3a3444;
      border-radius: 14px;
      background: #201c28;
      color: #efa9ae;
      font: 500 20px/1 'JetBrains Mono', monospace;
    }

    .met-chips b { color: #cec6de; font-weight: 500; }

    /* 08 · Wordmark poster */

    .og-word {
      position: relative;
      height: 100%;
      padding: 76px 84px;
    }

    .word-top {
      margin: 0;
      color: #64748b;
      font: 500 22px/1 'JetBrains Mono', monospace;
    }

    .word-domain {
      position: absolute;
      top: 76px;
      right: 84px;
      margin: 0;
      color: #241bc7;
      font: 500 22px/1 'JetBrains Mono', monospace;
    }

    .word-name {
      position: absolute;
      bottom: 58px;
      left: 80px;
      margin: 0;
      color: #3429ff;
      font-size: 210px;
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: .9;
    }

    /* 09 · Frosted card (project-card surface treatment) */

    .idcard {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 620px;
      padding: 56px 48px 48px;
      border-radius: 20px;
      background: #ffffff;
      background: color-mix(in srgb, #ffffff 72%, transparent);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: var(--ring), var(--xl);
      text-align: center;
    }

    .idcard-avatar {
      width: 124px;
      height: 124px;
      border: 4px solid #ffffff;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: var(--md);
    }

    .idcard-name {
      margin: 26px 0 0;
      color: #0f172a;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .idcard-role {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 26px;
      font-weight: 500;
    }

    .idcard-rule {
      width: 120px;
      height: 1px;
      margin-top: 30px;
      background: rgba(15, 23, 42, .1);
    }

    .idcard-domain {
      margin: 24px 0 0;
      color: #241bc7;
      font: 500 23px/1 'JetBrains Mono', monospace;
    }

    /* 10 · Bare prompt */

    .og-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 30px;
    }

    .prompt-line {
      margin: 0;
      color: #f5f0fa;
      font: 500 58px/1 'JetBrains Mono', monospace;
    }

    .prompt-sub {
      margin: 0;
      color: #7e7599;
      font: 500 26px/1 'JetBrains Mono', monospace;
    }

    /* Lightbox */

    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 40px;
      background: rgba(15, 23, 42, .55);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      cursor: zoom-out;
    }

    #lightbox[hidden] { display: none; }

    #lightbox-stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 32px 90px -20px rgb(15 23 42 / .5);
    }

    #lightbox-hint {
      position: fixed;
      right: 0;
      bottom: 22px;
      left: 0;
      margin: 0;
      color: rgba(255, 255, 255, .75);
      font: 500 13px/1 'JetBrains Mono', monospace;
      text-align: center;
    }

    /* Capture mode (?og=N): the chosen card alone, unscaled at 1200×630,
       for screenshotting the shipped asset. */

    html.capture,
    html.capture body {
      margin: 0;
      overflow: hidden;
      background: none;
    }

    html.capture .lab,
    html.capture #lightbox {
      display: none;
    }

    html.capture body > .og {
      position: fixed;
      top: 0;
      left: 0;
      transform: none;
    }
  </style>
</head>
<body>
  <main class="lab">
    <header class="lab-head">
      <h1>OG image proposals</h1>
      <p class="lab-sub">Ten directions for the social share card at 1200×630, drawn from the site's palette, type, and topography shader. Previews render at half size, which is how Slack and X show them. Click any card to see it 1:1.</p>
    </header>

    <div class="lab-grid">

      <!-- 01 · Hero, light -->
      <figure class="slot">
        <div class="og-frame" role="button" tabindex="0" aria-label="Inspect option 1, hero, at full size">
          <article class="og theme-light">
            <div class="og-ambient"></div>
            <div class="og-grain"></div>
            <div class="og-content og-hero">
              <p class="hero-top"><span class="ps1">~</span> miguelsolorio.com</p>
              <h2 class="hero-h">Designing software<br>for builders</h2>
              <p class="hero-foot">Miguel Solorio <span class="role">· Software Designer</span></p>
            </div>
          </article>
        </div>
        <figcaption>
          <span class="cap-n">01</span>
          <span class="cap-name">Hero</span>
          <span class="cap-tag">light</span>
          <p class="cap-note">The homepage headline doing what it already does best</p>
        </figcaption>
      </figure>

      <!-- 02 · Hero, dark -->
      <figure class="slot">
        <div class="og-frame" role="button" tabindex="0" aria-label="Inspect option 2, hero dark, at full size">
          <article class="og theme-dark">
            <div class="og-ambient"></div>
            <div class="og-grain"></div>
            <div class="og-content og-hero">
              <p class="hero-top"><span class="ps1">~</span> miguelsolorio.com</p>
              <h2 class="hero-h">Designing software<br>for builders</h2>
              <p class="hero-foot">Miguel Solorio <span class="role">· Software Designer</span></p>
            </div>
          </article>
        </div>
        <figcaption>
          <span class="cap-n">02</span>
          <span class="cap-name">Hero</span>
          <span class="cap-tag dark">dark</span>
          <p class="cap-note">Same bones in Rosé Dusk, rose carries the headline</p>
        </figcaption>
      </figure>

      <!-- 03 · Terminal, light -->
      <figure class="slot">
        <div class="og-frame" role="button" tabindex="0" aria-label="Inspect option 3, terminal, at full size">
          <article class="og theme-light">
            <div class="og-ambient"></div>
            <div class="og-grain"></div>
            <div class="og-content og-center">
              <div class="term">
                <div class="term-bar">
                  <span class="term-lights"><i></i><i></i><i></i></span>
                  <span class="term-title">miguelsolorio.com</span>
                  <span></span>
                </div>
                <div class="term-body">
                  <p class="t-row"><span class="ps1">~</span> <span class="t-cmd">whoami</span></p>
                  <p class="t-row"><span class="t-cmd">Miguel Solorio</span> <span class="t-dim">·</span> Software Designer</p>
                  <p class="t-row spaced"><span class="ps1">~</span> <span class="t-cmd">cat focus.txt</span></p>
                  <p class="t-row">developer tools <span class="t-dim">·</span> design systems <span class="t-dim">·</span> open source</p>
                  <p class="t-row spaced"><span class="ps1">~</span> <span class="t-cmd">open miguelsolorio.com</span><span class="caret"></span></p>
                </div>
              </div>
            </div>
          </article>
        </div>
        <figcaption>
          <span class="cap-n">03</span>
          <span class="cap-name">Terminal</span>
          <span class="cap-tag">light</span>
          <p class="cap-note">The hero terminal makes the introduction instead</p>
        </figcaption>
      </figure>

      <!-- 04 · Terminal, dark -->
      <figure class="slot">
        <div class="og-frame" role="button" tabindex="0" aria-label="Inspect option 4, terminal dark, at full size">
          <article class="og theme-dark">
            <div class="og-ambient"></div>
            <div class="og-grain"></div>
            <div class="og-content og-center">
              <div class="term">
                <div class="term-bar">
                  <span class="term-lights"><i></i><i></i><i></i></span>

  <div id="lightbox" hidden>
    <div id="lightbox-stage"></div>
    <p id="lightbox-hint">1200 × 630 · esc or click to close</p>

  <script>
    (() => {
      'use strict';

      /* --------------------------------------------------------------
         Topography ambient, ported from assets/js/common.js. Rendered
         once per palette at 2400×1260 with time frozen, snapshotted to
         a data URI, and layered onto every card's .og-ambient. The CSS
         gradients above are the no-WebGL fallback, same as the site.
         -------------------------------------------------------------- */

      const TUNE = {
        scale: 1.08,
        intensity: 0.51,
        grain: 0,
        vignette: 0.58,
        contours: 6,
        weight: 0.52,
        relief: 0.22,
      };

      /* Frozen u_time per theme: two different stretches of the same
         terrain, picked so light and dark don't share one field. */
      const TIME = { light: 132, dark: 268 };

      const hex = (h) => [
        parseInt(h.slice(1, 3), 16) / 255,
        parseInt(h.slice(3, 5), 16) / 255,
        parseInt(h.slice(5, 7), 16) / 255,
      ];

      const PALETTES = {
        light: { c1: hex('#f5f6f7'), c2: hex('#052fff'), c3: hex('#727cb1'), bg: hex('#f5f5f5') },
        dark: { c1: hex('#1c1725'), c2: hex('#6b5f7e'), c3: hex('#c2b2d3'), bg: hex('#110e1a') },
      };

      const VERT = 'attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }';

      const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform float u_time;
uniform vec2  u_resolution;
uniform float u_scale;
uniform float u_intensity;
uniform vec3  u_color1;
uniform vec3  u_color2;
uniform vec3  u_color3;
uniform vec3  u_bg;
uniform float u_grain;
uniform float u_vignette;
uniform float u_p1;
uniform float u_p2;
uniform float u_p3;

float hash21(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
const mat2 ROT2 = mat2(0.8, 0.6, -0.6, 0.8);
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = ROT2 * p * 2.02; a *= 0.5; }
  return s;
}

vec3 permute3(vec3 x) { return mod((x * 34.0 + 1.0) * x, 289.0); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute3(permute3(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m; m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

vec3 lmix(vec3 a, vec3 b, float t) {
  t = clamp(t, 0.0, 1.0);
  return sqrt(mix(a * a, b * b, t));
}

float readability(vec2 suv) {
  float ex = smoothstep(0.0, 0.1, suv.x) * (1.0 - smoothstep(0.9, 1.0, suv.x));
  float ey = smoothstep(0.0, 0.12, suv.y) * (1.0 - smoothstep(0.88, 1.0, suv.y));
  float edge = 1.0 - ex * ey;
  vec2 d = (suv - vec2(0.3, 0.55)) / vec2(0.36, 0.3);
  float copy = 1.0 - smoothstep(0.45, 1.3, dot(d, d));
  return clamp(max(edge, copy), 0.0, 1.0);
}

vec3 scene(vec2 uv, vec2 suv) {
  float t = u_time * 0.05;
  float h = fbm(uv * 1.2 + vec2(t * 0.7, -t * 0.4));
  h += 0.18 * snoise(uv * 0.5 + t);
  vec3 col = lmix(u_color1, u_color2, h * u_p3);
  float f = fract(h * u_p1);
  float dLine = min(f, 1.0 - f);
  float line = 1.0 - smoothstep(0.0, 0.045 * u_p2, dLine);
  float f5 = fract(h * u_p1 / 5.0);
  float d5 = min(f5, 1.0 - f5);
  float major = 1.0 - smoothstep(0.0, 0.012 * u_p2, d5);
  col = lmix(col, u_color2, line * 0.55);
  col = lmix(col, u_color3, major * 0.8);
  return col;
}

void main() {
  vec2 suv = gl_FragCoord.xy / u_resolution;
  vec2 uv = (suv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.0) / u_scale;
  vec3 col = scene(uv, suv);
  col = mix(u_bg, col, u_intensity);
  col = mix(col, u_bg, readability(suv) * u_vignette);
  col += (hash21(gl_FragCoord.xy + floor(u_time * 8.0) * 17.0) - 0.5) * u_grain;
  col += (hash21(gl_FragCoord.xy) - 0.5) / 128.0;
  gl_FragColor = vec4(col, 1.0);
}
`;

      const applyAmbient = () => {
        const canvas = document.createElement('canvas');
        const DPR = 2;
        canvas.width = 1200 * DPR;
        canvas.height = 630 * DPR;

        let gl = null;
        try {
          /* preserveDrawingBuffer so toDataURL reads back reliably. */
          gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true });
        } catch {
          gl = null;
        }
        if (!gl) return;

        const compile = (type, src) => {
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            console.error(`og lab: shader failed to compile: ${gl.getShaderInfoLog(sh)}`);
            return null;
          }
          return sh;
        };

        const vs = compile(gl.VERTEX_SHADER, VERT);
        const fs = compile(gl.FRAGMENT_SHADER, FRAG);
        if (!vs || !fs) return;

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          console.error(`og lab: program failed to link: ${gl.getProgramInfoLog(prog)}`);
          return;
        }
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const U = {};
        ['u_time', 'u_resolution', 'u_scale', 'u_intensity', 'u_color1', 'u_color2', 'u_color3', 'u_bg', 'u_grain', 'u_vignette', 'u_p1', 'u_p2', 'u_p3']
          .forEach((name) => { U[name] = gl.getUniformLocation(prog, name); });

        gl.viewport(0, 0, canvas.width, canvas.height);

        const snap = (pal, t) => {
          gl.uniform1f(U.u_time, t);
          gl.uniform2f(U.u_resolution, canvas.width, canvas.height);
          gl.uniform1f(U.u_scale, TUNE.scale);
          gl.uniform1f(U.u_intensity, TUNE.intensity);
          gl.uniform3fv(U.u_color1, pal.c1);
          gl.uniform3fv(U.u_color2, pal.c2);
          gl.uniform3fv(U.u_color3, pal.c3);
          gl.uniform3fv(U.u_bg, pal.bg);
          gl.uniform1f(U.u_grain, TUNE.grain);
          gl.uniform1f(U.u_vignette, TUNE.vignette);
          gl.uniform1f(U.u_p1, TUNE.contours);
          gl.uniform1f(U.u_p2, TUNE.weight);
          gl.uniform1f(U.u_p3, TUNE.relief);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          try {
            return canvas.toDataURL('image/png');
          } catch {
            return null;
          }
        };

        const light = snap(PALETTES.light, TIME.light);
        const dark = snap(PALETTES.dark, TIME.dark);

        if (light) {
          document.querySelectorAll('.theme-light .og-ambient').forEach((el) => {
            el.style.backgroundImage = `url(${light})`;
          });
        }
        if (dark) {
          document.querySelectorAll('.theme-dark .og-ambient').forEach((el) => {
            el.style.backgroundImage = `url(${dark})`;
          });
        }
      };

      applyAmbient();

      /* Capture mode: ?og=N strips the lab away and pins card N unscaled
         at true size, so a 1200×630 screenshot is the finished asset. */

      const captureIndex = Number(new URLSearchParams(window.location.search).get('og'));
      if (captureIndex >= 1) {
        const card = document.querySelectorAll('.og')[captureIndex - 1];
        if (card) {
          document.documentElement.classList.add('capture');
          document.body.appendChild(card);
          return;
        }
      }

      /* Scale each fixed 1200×630 card to its preview frame. */

      const frames = Array.from(document.querySelectorAll('.og-frame'));
      const ro = new ResizeObserver((entries) => {
        for (const entry of entries) {
          const og = entry.target.querySelector('.og');
          og.style.transform = `scale(${entry.contentRect.width / 1200})`;
        }
      });
      frames.forEach((frame) => ro.observe(frame));

      /* Lightbox: clone the card and show it as close to 1:1 as fits. */

      const lightbox = document.getElementById('lightbox');
      const stage = document.getElementById('lightbox-stage');
      let openedFrom = null;

      const fitStage = () => {
        const s = Math.min((window.innerWidth - 96) / 1200, (window.innerHeight - 150) / 630, 1);
        stage.style.transform = `scale(${s})`;
      };

      const openBox = (frame) => {
        const og = frame.querySelector('.og');
        stage.textContent = '';
        const clone = og.cloneNode(true);
        clone.style.transform = 'none';
        stage.appendChild(clone);
        fitStage();
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        openedFrom = frame;
      };

      const closeBox = () => {
        lightbox.hidden = true;
        document.body.style.overflow = '';
        if (openedFrom) openedFrom.focus();
        openedFrom = null;
      };

      frames.forEach((frame) => {
        frame.addEventListener('click', () => openBox(frame));
        frame.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openBox(frame);
          }
        });
      });

      lightbox.addEventListener('click', closeBox);
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !lightbox.hidden) closeBox();
      });
      window.addEventListener('resize', () => {
        if (!lightbox.hidden) fitStage();
      });
    })();
  </script>
