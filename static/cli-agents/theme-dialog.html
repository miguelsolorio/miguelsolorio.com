<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini CLI theme picker</title>
<script src="/demo-system/demo-system.js?v=2"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./cli-animation.css?v=6">
<link rel="stylesheet" href="./diff-view.css?v=4">
<link rel="stylesheet" href="./theme-dialog.css?v=21">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script defer src="./diff-view.js?v=2"></script>
<script defer src="./theme-dialog.js?v=5"></script>
</head>
<body class="demo-scene diff-scene theme-scene" data-demo-scene="cli-theme">

<main class="diff-stage">
  <div class="diff-panel theme-panel" data-cli-theme="default">
    <div class="theme-cols">

      <section class="theme-list-col">
        <div class="theme-title" id="theme-list-label">&gt; Select Theme</div>
        <button type="button" class="theme-scroll" data-theme-step="-1" aria-label="Preview the previous theme">&#9650;</button>
        <div class="theme-list tool-body" role="listbox" tabindex="0" aria-labelledby="theme-list-label">
          <section class="theme-list-group" role="group" aria-labelledby="theme-dark-label">
            <div class="theme-group-title" id="theme-dark-label">Dark</div>
            <ul class="theme-group-options" role="presentation">
              <li class="tool-opt theme-item" role="option" id="theme-ansi" data-cli-theme="ansi" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">1.</span> ANSI</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-atom-one" data-cli-theme="atom-one" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">2.</span> Atom One</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-ayu" data-cli-theme="ayu" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">3.</span> Ayu</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-default" data-cli-theme="default" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">4.</span> Default Dark</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-dracula" data-cli-theme="dracula" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">5.</span> Dracula</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-github" data-cli-theme="github" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">6.</span> GitHub</span></li>
            </ul>
          </section>
          <section class="theme-list-group" role="group" aria-labelledby="theme-light-label">
            <div class="theme-group-title" id="theme-light-label">Light</div>
            <ul class="theme-group-options" role="presentation">
              <li class="tool-opt theme-item" role="option" id="theme-ansi-light" data-cli-theme="ansi-light" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">7.</span> ANSI</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-ayu-light" data-cli-theme="ayu-light" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">8.</span> Ayu</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-default-light" data-cli-theme="default-light" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">9.</span> Default Light</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-github-light" data-cli-theme="github-light" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">10.</span> GitHub</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-google-code" data-cli-theme="google-code" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">11.</span> Google Code</span></li>
              <li class="tool-opt theme-item" role="option" id="theme-solarized-light" data-cli-theme="solarized-light" aria-selected="false"><span class="tool-opt-bullet">&#9679;</span><span><span class="tool-opt-num theme-num">12.</span> Solarized</span></li>
            </ul>
          </section>
        </div>
        <button type="button" class="theme-scroll" data-theme-step="1" aria-label="Preview the next theme">&#9660;</button>
      </section>

      <section class="theme-preview-col">
        <div class="theme-title">Preview</div>
        <div class="theme-preview">
          <div data-diff="theme-preview"></div>
        </div>
      </section>

    </div>
    <div class="theme-hint">(Enter to select, Tab for scope, Esc to close)</div>
  </div>
</main>

</body>
</html>
