<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini CLI demo</title>
<script src="/demo-system/demo-system.js?v=4"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./cli-animation.css?v=11">
<link rel="stylesheet" href="./cli-theme.css?v=1">
<script defer src="./cli-theme.js?v=1"></script>
</head>
<body class="demo-scene demo-scene--cli" data-demo-scene="cli">

<main class="cli-stage" data-demo-stage>
<div class="scroll-area" id="scrollArea">
  <div class="convo-area">
    <div id="convoInner"></div>
  </div>

  <div class="tool-box" id="confirmBox">
    <div class="tool-box-inner">
      <div class="tool-header">
        <span class="tool-q">?</span>
        <span class="tool-label">Confirm plan</span>
      </div>
      <div class="tool-body">
        <div class="tool-opt selected" data-opt="0"><span class="tool-opt-bullet">●</span><span><span class="tool-opt-num">1.</span> Yes, proceed</span></div>
        <div class="tool-opt" data-opt="1"><span class="tool-opt-bullet"> </span><span><span class="tool-opt-num">2.</span> Suggest changes</span></div>
        <div class="tool-opt" data-opt="2"><span class="tool-opt-bullet"> </span><span><span class="tool-opt-num">3.</span> Cancel (esc)</span></div>
      </div>
    </div>
  </div>
  <div class="tool-box" id="shellBox">
    <div class="tool-box-inner">
      <div class="tool-header">
        <span class="tool-q">?</span>
        <span class="tool-label">Shell</span>
        <span class="tool-header-sub">npm create vite@latest todo-app -- --template react</span>
      </div>
      <div class="tool-body">
        <div class="tool-command">npm create vite@latest todo-app -- --template react</div>
        <div class="tool-question">Allow execution?</div>
        <div class="tool-opt selected" data-shell-opt="0"><span class="tool-opt-bullet">●</span><span><span class="tool-opt-num">1.</span> Yes, allow once</span></div>
        <div class="tool-opt" data-shell-opt="1"><span class="tool-opt-bullet"> </span><span><span class="tool-opt-num">2.</span> Yes, allow always "npm ..."</span></div>
        <div class="tool-opt" data-shell-opt="2"><span class="tool-opt-bullet"> </span><span><span class="tool-opt-num">3.</span> No (esc)</span></div>
      </div>
    </div>
  </div>
  <div class="scroll-end"></div>
</div>

<div class="bottom-bar"></div>
</main>

<script src="./cli-components.js?v=1"></script>
<script src="./cli-animation.js?v=3"></script>
</body>
</html>
