<title>GitHub star history for the three terminal agents</title>
<script src="/demo-system/demo-system.js?v=4"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./star-history.css?v=3">

<body class="demo-scene star-scene" data-demo-scene="cli-star-history">

<svg id="star-history" class="star-chart" role="img" aria-labelledby="star-title star-desc">
  <title id="star-title">GitHub stars for the three terminal coding agents, March to September 2025</title>
  <desc id="star-desc">
    anthropics/claude-code climbs steadily from about 4,600 stars in March to
    32,000 by September. openai/codex opens in mid-April with a jump to about
    15,000 and reaches 38,000 by September. google-gemini/gemini-cli sits under
    3,000 until it launches on June 25, then rises almost vertically to 40,000
    within a week and keeps climbing to about 72,000 by September, passing both
    of the others.
  </desc>
</svg>

</body>
