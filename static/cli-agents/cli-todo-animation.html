<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini CLI todo tool demo</title>
<script src="/demo-system/demo-system.js?v=2"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./cli-animation.css?v=7">
<link rel="stylesheet" href="./cli-theme.css?v=1">
<link rel="stylesheet" href="./cli-todo-animation.css?v=5">
<script defer src="./cli-theme.js?v=1"></script>
</head>
<body class="demo-scene demo-scene--cli" data-demo-scene="cli">

<main class="cli-stage" data-demo-stage>
  <div class="scroll-area" id="scrollArea">
    <div class="convo-area">
      <div id="convoInner"></div>
    </div>
    <div class="scroll-end"></div>
  </div>

  <div class="bottom-bar">
    <section class="todo-tray" id="todoTray" aria-label="Grouped todo list">
      <div class="todo-title">
        <span class="todo-emoji" aria-hidden="true">📝</span>
        <span class="todo-name">Todo</span>
        <span class="todo-score" id="todoScore">0/4 (ctrl+t to toggle)</span>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </section>
  </div>

</main>

<script src="./cli-components.js?v=1"></script>
<script src="./cli-todo-animation.js?v=5"></script>
</body>
</html>
