<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly npm downloads for @vscode/codicons</title>
<script src="/demo-system/demo-system.js?v=2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./npm-downloads.css?v=2">
<script defer src="./npm-downloads.js?v=2"></script>
</head>
<body class="demo-scene npm-scene" data-demo-scene="icons-npm-downloads">

<figure class="npm">
  <h1 class="npm-title">npm downloads</h1>

  <div class="npm-plot">
    <canvas id="npm-canvas" role="img" aria-label="Weekly npm downloads of @vscode/codicons from July 2021 to August 2026. The package opens at almost nothing, clears 6,000 a week by the end of August 2021, and settles between 20,000 and 30,000 a week through 2022 and 2023. It climbs through 2024 to about 50,000, then through 2025 to about 110,000, dipping each year over the holidays. In 2026 it accelerates to roughly 250,000 a week by spring, then steps up sharply at the start of June to around 600,000, peaking at just over 1 million in the week of 22 June. It holds near 580,000 a week through the summer."></canvas>
  </div>

  <figcaption class="npm-meta">
    <p class="npm-note">Used by <b class="npm-count">1.1k</b> projects</p>
    <p class="npm-source">
      <a href="https://www.npmjs.com/package/@vscode/codicons" target="_blank" rel="noopener noreferrer">https://www.npmjs.com/package/@vscode/codicons</a>
    </p>
  </figcaption>
</figure>

</body>
</html>
