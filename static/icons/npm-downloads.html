<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly npm downloads for @vscode/codicons</title>
<script src="/demo-system/demo-system.js?v=2"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="/demo-system/demo-system.css">
<link rel="stylesheet" href="./npm-downloads.css?v=2">
<script defer src="./npm-downloads.js?v=2"></script>
</head>
<body class="demo-scene npm-scene" data-demo-scene="icons-npm-downloads">

<figure class="npm">
  <h1 class="npm-title">npm downloads</h1>

  <div class="npm-plot">
    <canvas id="npm-canvas" role="img" aria-label="Weekly npm downloads of @vscode/codicons from July 2021 to April 2022. The package opens at almost nothing, clears 6,000 a week by the end of August 2021, and holds between 6,000 and 8,000 through the autumn. It reaches about 11,800 by mid-December, drops to 8,000 over the holidays, then jumps to 16,500 in the first week of January. It settles between 12,000 and 17,500 through the spring and reaches roughly 19,500 a week by mid-April."></canvas>
  </div>

  <figcaption class="npm-meta">
    <p class="npm-note">Used by <b class="npm-count">1.1k</b> projects</p>
    <p class="npm-source">
      <a href="https://www.npmjs.com/package/@vscode/codicons" target="_blank" rel="noopener noreferrer">https://www.npmjs.com/package/@vscode/codicons</a>
    </p>
  </figcaption>
</figure>

</body>
</html>
