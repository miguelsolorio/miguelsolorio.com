<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <script src="/demo-system/demo-system.js?v=4"></script>
  <script>
    if (new URLSearchParams(location.search).has('card')) {
      document.documentElement.classList.add('is-card');
    }
  </script>
  <style>
    :root {
      --background: linear-gradient(180deg, #fdfdff 0%, #f6f8fa 100%);
      --icon-1: #8b7cff;
      --icon-2: #a294f2;
      --icon-3: #c0b2f7;
      --icon-mark: #6d5cf0;
      --hot: #3429ff;

      --dim: .58;
    }

    :root.dark {
      --background: linear-gradient(180deg, #201c28 0%, #18151f 100%);
      --icon-1: #a494bd;
      --icon-2: #82739c;
      --icon-3: #63567a;
      --icon-mark: #c6b2d9;
      --hot: #efa9ae;
      --dim: .62;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--background);
    }

    .is-card body {
      background: transparent;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 240px;
      overflow: hidden;
      isolation: isolate;
    }

    .board {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      grid-template-columns: repeat(24, 51px);
      grid-auto-rows: 51px;
      place-items: center;
      transform-origin: 50% 50%;
      transform: translate(-50%, -50%);
    }

    @property --sweep {
      syntax: '<number>';
      inherits: false;
      initial-value: 0;
    }

    @property --near {
      syntax: '<number>';
      inherits: true;
      initial-value: 0;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      width: 51px;
      height: 51px;
      --tier: var(--icon-2);
      --lift: 0;
      animation: rise .7s cubic-bezier(.2, .7, .3, 1) backwards;
      transition: --near .22s ease-out;
      z-index: calc(1 + var(--near) * 20);
    }

    .cell svg {
      display: block;
      width: 20px;
      height: 20px;
      opacity: min(1, calc(var(--dim) + var(--lift) + (1 - var(--dim)) * max(var(--sweep), var(--near))));
      color: color-mix(in oklab, var(--tier), var(--hot) calc(var(--near) * 100%));
      transform: scale(calc(1 + var(--near) * .95));
      animation: sweep 11s linear infinite;
    }

    .cell--1 { --tier: var(--icon-1); }
    .cell--2 { --tier: var(--icon-2); }
    .cell--3 { --tier: var(--icon-3); }

    .cell--mark {
      --tier: var(--icon-mark);
      --lift: .3;
    }

    @keyframes rise {
      from { opacity: 0; transform: scale(.82); }
      to { opacity: 1; transform: none; }
    }

    @keyframes sweep {
      0%, 74% { --sweep: 0; }
      86% { --sweep: 1; }
      100% { --sweep: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell,
      .cell svg {
        animation: none;
        transition: none;
      }

      .cell svg {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="A grid of several hundred product icons in a single outline style">
    <div class="board" aria-hidden="true"></div>
  </main>

  <script>
    (async function () {
      const COLUMNS = 24;
      const ROWS = 14;

      const MARKED = new Set([
        3, 4, 14, 17, 18, 19, 20, 28, 31, 45, 58, 68, 71, 72, 81, 84, 85, 94,
        97, 110, 111, 123, 124, 136, 149, 162, 176, 188, 190, 191, 201, 204,
        205, 213, 232, 246, 260, 274, 288, 300, 302, 315, 316
      ]);
      const TIERS = 3;

      const RADIUS = 2.7;

      const stage = document.querySelector('.stage');
      const board = document.querySelector('.board');

      const spriteResponse = await fetch('icons-sprite.svg');
      const spriteHolder = document.createElement('div');
      spriteHolder.innerHTML = await spriteResponse.text();
      const sprite = spriteHolder.firstElementChild;
      sprite.setAttribute('aria-hidden', 'true');
      document.body.prepend(sprite);

      const total = document.querySelectorAll('symbol[id^="icon-"]').length;

      function build() {
        const cells = document.createDocumentFragment();

        for (let index = 0; index < Math.min(total, COLUMNS * ROWS); index += 1) {
          const column = index % COLUMNS;
          const row = Math.floor(index / COLUMNS);
          const diagonal = column + row;

          const cell = document.createElement('div');
          cell.className = MARKED.has(index)
            ? 'cell cell--mark'
            : 'cell cell--' + ((diagonal % TIERS) + 1);

          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('aria-hidden', 'true');

          const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          use.setAttribute('href', '#icon-' + index);
          svg.appendChild(use);

          cell.style.animationDelay = (diagonal * 22) + 'ms';
          svg.style.animationDelay = (-(diagonal / (COLUMNS + ROWS)) * 11).toFixed(2) + 's';

          cell.appendChild(svg);
          cells.appendChild(cell);
        }

        board.replaceChildren(cells);
      }

      function fit() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        if (!width || !height) return;

        board.style.transform = 'translate(-50%, -50%)';

        const natural = board.getBoundingClientRect();
        const card = document.documentElement.classList.contains('is-card');
        const scale = card
          ? Math.max(width / natural.width, height / natural.height)
          : Math.min(width / natural.width, height / natural.height) * 0.92;

        board.style.transform = 'translate(-50%, -50%) scale(' + scale.toFixed(4) + ')';
        metrics = null;
      }

      let metrics = null;
      let lit = [];
      let point = null;
      let frame = null;

      function measure() {
        const rect = board.getBoundingClientRect();

        metrics = {
          left: rect.left,
          top: rect.top,
          column: rect.width / COLUMNS,
          row: rect.height / ROWS
        };
      }

      function darken() {
        lit.forEach((cell) => cell.style.removeProperty('--near'));
        lit = [];
      }

      function illuminate(x, y) {
        if (!metrics) measure();

        const at = { column: (x - metrics.left) / metrics.column - 0.5, row: (y - metrics.top) / metrics.row - 0.5 };
        const cells = board.children;
        const next = [];

        darken();

        for (let row = Math.max(0, Math.ceil(at.row - RADIUS)); row <= Math.min(ROWS - 1, Math.floor(at.row + RADIUS)); row += 1) {
          for (let column = Math.max(0, Math.ceil(at.column - RADIUS)); column <= Math.min(COLUMNS - 1, Math.floor(at.column + RADIUS)); column += 1) {
            const distance = Math.hypot(column - at.column, row - at.row);
            if (distance > RADIUS) continue;

            const cell = cells[row * COLUMNS + column];
            if (!cell) continue;

            const fade = 1 - distance / RADIUS;
            cell.style.setProperty('--near', (fade * fade * (3 - 2 * fade)).toFixed(3));
            next.push(cell);
          }
        }

        lit = next;
      }

      function track(event) {
        point = { x: event.clientX, y: event.clientY };
        if (frame !== null) return;

        frame = requestAnimationFrame(() => {
          frame = null;
          if (point) illuminate(point.x, point.y);
        });
      }

      build();
      fit();
      window.addEventListener('resize', fit);
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(fit).observe(stage);
      }

      if (window.matchMedia('(hover: hover)').matches) {
        stage.addEventListener('pointermove', track);
        stage.addEventListener('pointerleave', () => {
          point = null;
          darken();
        });
      }
    })();
  </script>
</body>
</html>
