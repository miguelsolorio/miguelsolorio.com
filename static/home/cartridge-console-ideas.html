<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartridge and console designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3429ff; --shadow-hover: 0 12px 28px -8px rgb(35 28 102 / .38); --bg-a: #f2f0ff;
      --bg-b: #f8f7ff; --bg-c: #f5f5f5; --ink: #1e293b;
      --muted: #64748b; --bar: rgb(255 255 255 / .78); --bar-line: #e2e8f0;
      --card: #fff; --card-line: #e2e8f0; --card-title: #1e293b;
      --card-desc: #64748b; --pill-line: #dbe3ec; --pill-bg: #f8fafc;
      --pill-ink: #64748b; --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html.dark {
      --primary: #8b85ff; --bg-a: #161320; --bg-b: #1a1626;
      --bg-c: #110e1a; --ink: #ede7f2; --muted: #8c839f;
      --bar: rgb(26 22 38 / .8); --bar-line: #3a3444; --card: #201c28;
      --card-line: #3a3444; --card-title: #ede7f2; --card-desc: #8c839f;
      --pill-line: #4e4759; --pill-bg: #2a2534; --pill-ink: #a59cad;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 6rem;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg-a), var(--bg-b) 45%, var(--bg-c)) fixed;
      -webkit-font-smoothing: antialiased;
    }
    .lab-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .875rem;
      padding: .5rem 1rem;
      background: var(--bar);
      border-bottom: 1px solid var(--bar-line);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .lab-bar-title { margin: 0; font: 700 .75rem/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    .lab-theme, .lab-copy, .lab-sound {
      font: 600 .75rem/1 Inter, system-ui, sans-serif;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--bar-line);
      border-radius: 999px;
      padding: .4375rem .75rem;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }
    .lab-theme:hover, .lab-copy:hover, .lab-sound:hover { color: var(--ink); border-color: var(--primary); }
    .lab-theme:focus-visible, .lab-copy:focus-visible, .lab-sound:focus-visible, .lab-tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .lab-main { max-width: 64rem; margin: 0 auto; padding: 0 1rem; }
    .lab-section { padding-top: 2rem; }
    .lab-h { margin: 0; font: 700 .8125rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .lab-sub { margin: .5rem 0 1rem; font-size: .875rem; line-height: 1.45; color: var(--muted); }
    .lab-empty { grid-column: 1 / -1; margin: 0; padding: 1.5rem 0; font: 500 .75rem/1 var(--mono); color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(12.5rem, calc(50% - .5rem)), 1fr)); gap: 1rem; }
    .stage { perspective: 1200px; }
    .side-project {
      display: block;
      background: var(--card);
      color: inherit;
      text-align: center;
      text-decoration: none;
      border: 1px solid var(--card-line);
      border-radius: 1rem;
      padding: clamp(1.125rem, 3vw, 1.375rem) clamp(.75rem, 2.5vw, 1rem);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s ease;
    }
    .side-project:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    .side-project img { display: block; width: 3.5rem; height: 3.5rem; margin: 0 auto; border-radius: .875rem; }
    .side-project-title { margin: .75rem 0 0; font-size: .9375rem; font-weight: 700; color: var(--card-title); }
    .side-project-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: .375rem 0 0;
      font-size: .8125rem;
      line-height: 1.35;
      color: var(--card-desc);
      overflow-wrap: anywhere;
    }
    .side-project-model {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: .625rem 0 0;
      padding: .3125rem .5625rem;
      border: 1px solid var(--pill-line);
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-ink);
      font-size: .6875rem;
      font-weight: 400;
      line-height: 1;
    }
    .lab-toasts {
      position: fixed;
      left: 1rem;
      bottom: 4rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .5rem;
      pointer-events: none;
    }
    .lab-toast {
      max-width: min(26rem, calc(100vw - 2rem));
      padding: .625rem .875rem;
      border-radius: .75rem;
      background: #1e1b2e;
      color: #f4f1ff;
      font: 500 .75rem/1.35 var(--mono);
      box-shadow: 0 10px 24px -8px rgb(20 16 60 / .5);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s ease, transform .2s ease;
      overflow-wrap: anywhere;
    }
    .lab-toast.is-in { opacity: 1; transform: none; }
    html.dark .lab-toast { background: #ede7f2; color: #1a1626; }
    .lab-readout {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: .625rem;
      padding: .375rem .375rem .375rem .875rem;
      background: var(--bar);
      border: 1px solid var(--bar-line);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .lab-readout-text { font: 700 .6875rem/1 var(--mono); letter-spacing: .04em; white-space: nowrap; }
    .lab-item { position: relative; display: flex; flex-direction: column; padding-top: 4rem; outline: none; }
    .lab-item.is-active { z-index: 60; }
    .lab-item > .side-project { position: relative; z-index: 2; flex: 1; }
    .lab-peek {
      position: absolute;
      top: calc(4rem + 4px);
      left: 50%;
      width: 112px;
      height: 104px;
      margin-left: -56px;
      z-index: 1;
      pointer-events: none;
      transform: translateY(0);
      transition: transform .26s cubic-bezier(.4, 0, .6, 1), rotate .26s ease;
    }
    .lab-item.is-peek .lab-peek {
      transform: translateY(-42px);
      rotate: -3deg;
      transition-duration: .32s;
      transition-timing-function: cubic-bezier(.2, .8, .2, 1);
      animation: lab-peek-bob 2.4s ease-in-out .32s infinite;
    }
    .lab-item.is-peek .lab-peek:hover { transform: translateY(-66px); rotate: -2deg; transition-duration: .22s; }
    .lab-item.is-active .lab-peek { z-index: 3; rotate: none; translate: none; animation: none; transition: none; }
    .lab-peek .cart { position: absolute; inset: 0; margin: auto; cursor: grab; touch-action: none; outline: none; pointer-events: auto; }
    .lab-peek .cart.lab-grow, .lab-peek .cart.lab-grow.is-dragging { transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
    .lab-peek .cart:focus-visible { filter: drop-shadow(0 0 6px var(--cart-color, var(--primary))); }
    @keyframes lab-peek-bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -2px; }
    }
    .lab-dock {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 50;
      width: max-content;
      pointer-events: none;
      transform: translate(-50%, 170%);
      transition: transform .55s cubic-bezier(.34, 1.3, .64, 1);
    }
    .lab-dock.is-up { transform: translate(-50%, 0); }
    .lab-dock .console { transform-origin: 50% 100%; }
    .lab-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1rem; }
    #lab-consoles { grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); }
    .lab-tile {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: .25rem;
      padding: .75rem;
      font: inherit;
      color: inherit;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--card-line);
      border-radius: 1rem;
      cursor: pointer;
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .lab-tile:hover { border-color: var(--primary); }
    .lab-tile.is-selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
    .lab-tile .stage {
      display: grid;
      place-items: center;
      min-height: 9.5rem;
      margin-bottom: .5rem;
      border-radius: .625rem;
      background: var(--pill-bg);
    }
    .lab-console-stage { display: block; padding: .5rem; min-height: 0; }
    .lab-fit { position: relative; margin: 0 auto; }
    .lab-fit .console { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .lab-tile-name { font: 700 .6875rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .lab-tile-note { font-size: .75rem; line-height: 1.35; color: var(--muted); }
    .cart {
      position: relative;
      perspective: 900px;
      transform:
        translate3d(var(--drag-x, 0px), var(--drag-y, 0px), 0)
        var(--cart-transform, none);
      transition: transform .18s ease-out;
      user-select: none;
      -webkit-user-select: none;
    }
    .cart.is-dragging { transition: none; cursor: grabbing; z-index: 50; }
    .cart.is-spring { transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
    .cart.is-flying { transition: transform .5s cubic-bezier(.34, 1.3, .64, 1); }
    .cart.lab-fly { transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
    .cart.lab-sink { transition: none; }
    .lab-static {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      image-rendering: pixelated;
      transition: opacity .12s linear;
    }
    .lab-static.is-in { opacity: 1; }
    .lab-static.is-out { transition-duration: .16s; }
    .lab-static.is-plain { background: rgb(0 0 0 / .6); transition: none; }
    body.lab-seq .lab-dock { z-index: 320; }
    body.lab-seq .lab-item.is-active { z-index: 330; }
    body.lab-static-on .lab-item.is-active .side-project { visibility: hidden; }
    body.lab-seq .lab-toasts { z-index: 400; }
    .lab-bar-actions { display: flex; align-items: center; gap: .5rem; }
    .cart--float { animation: lab-bob 3.2s ease-in-out infinite; }
    .cart--float.is-dragging, .cart--float.is-spring { animation: none; }
    @keyframes lab-bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }
    .console { position: relative; perspective: 1200px; }
    .console-screen { position: relative; overflow: hidden; container-type: size; }
    .screen-static, .screen-logo, .screen-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }
    .screen-static {
      background:
        repeating-linear-gradient(0deg, rgb(255 255 255 / .55) 0 1px, rgb(0 0 0 / .6) 1px 2px),
        repeating-linear-gradient(90deg, rgb(255 255 255 / .4) 0 2px, rgb(0 0 0 / .4) 2px 5px),
        #777;
      animation: lab-static .24s steps(4) infinite;
    }
    @keyframes lab-static {
      to { background-position: 0 7px, 11px 0, 0 0; }
    }
    .screen-logo::before {
      content: "MS";
      padding: .4em .5em;
      font: 700 clamp(7px, 14cqh, 14px)/1 var(--mono);
      letter-spacing: .08em;
      background: var(--primary);
      color: #fff;
      image-rendering: pixelated;
      box-shadow: 3px 3px 0 #000, inset -2px -2px 0 rgb(0 0 0 / .3), inset 2px 2px 0 rgb(255 255 255 / .35);
    }
    .screen-title {
      padding: 4px;
      text-align: center;
      font: 700 clamp(7px, 10cqw, 13px)/1.25 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #9bffb5;
      text-shadow: 0 0 6px rgb(155 255 181 / .7);
    }
    .console-screen.is-static .screen-static,
    .console.is-error .screen-static { opacity: 1; }
    .console-screen.is-logo .screen-logo { opacity: 1; }
    .console-screen.is-title .screen-title { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .cart--float, .screen-static { animation: none; }
      .cart, .cart.is-spring, .cart.is-flying, .cart.lab-fly { transition: none; }
      .lab-static { transition: none; }
      .side-project, .lab-toast, .lab-tile, .console-slot { transition: none; }
      .side-project:hover { transform: none; }
      .lab-peek, .lab-item.is-peek .lab-peek { transition: none; animation: none; rotate: none; opacity: 0; }
      .lab-item.is-peek .lab-peek, .lab-item.is-active .lab-peek { opacity: 1; }
      .lab-peek .cart.lab-grow, .lab-peek .cart.lab-grow.is-dragging { transition: none; }
      .lab-dock { transform: translate(-50%, 0); opacity: 0; transition: opacity .2s; }
      .lab-dock.is-up { opacity: 1; }
    }
  </style>

.cs-1 {

  --dt: #dddcd7;
  --df: #cac9c4;

.dark .cs-1 {
  --t: #b2b1ad;

  --dt: #b6b5b1;

        syncTheme();
      });
      function readoutText() { return 'Cartridge ' + numOf(sel.cart) + ' · Console ' + numOf(sel.console); }
      function syncReadout() { readout.textContent = readoutText(); }
      document.getElementById('lab-copy').addEventListener('click', function () {
        var text = readoutText();
        var done = function () { Lab.toast('Copied: ' + text); };
        var fail = function () { Lab.toast('Copy failed. Choice: ' + text); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fail);
        } else {
          fail();
        }
      });
      function setPos(c, x, y) { c.style.setProperty('--drag-x', x + 'px'); c.style.setProperty('--drag-y', y + 'px'); }
      function getPos(c) {
        return {
          x: parseFloat(c.style.getPropertyValue('--drag-x')) || 0,
          y: parseFloat(c.style.getPropertyValue('--drag-y')) || 0
        };
      }
      function flatTilt(c) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }
      var PEEK_SCALE = 1;
      var PEEK_TRANSFORM = 'scale(' + PEEK_SCALE + ')';
      function peek(it, v) {
        if (v && (!it.cart || (cur && cur !== it))) return;
        it.el.classList.toggle('is-peek', v);
      }
      function lift() { dock.classList.add('is-up'); }
      function lower() { dock.classList.remove('is-up'); if (cons) cons.setHot(false); }
      function settle(it) {
        cur = null;
        it.el.classList.remove('is-active');
        items.forEach(function (o) { peek(o, o.held); });
      }
      var SEQ = { fly: 320, sink: 240, settle: 80, hold: 220, run: 650, fadeIn: 120, fadeOut: 160, plain: 500, linger: 400, lift: 200 };
      var SINK_FRACTION = .34;
      var seqRaf = 0;
      var staticRaf = 0;
      var staticEl = null;
      var audioCtx = null;
      function tween(ms, step, done) {
        var t0 = performance.now();
        function frame(now) {
          var k = Math.max(0, Math.min(1, (now - t0) / ms));
          step(k);
          if (k < 1) {
            seqRaf = requestAnimationFrame(frame);
          } else {
            seqRaf = 0;
            done();
          }
        }
        seqRaf = requestAnimationFrame(frame);
      }
      function audio() {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === 'suspended') {
            var r = audioCtx.resume();
            if (r && r.catch) r.catch(function () {});
          }
          return audioCtx;
        } catch (err) {
          return null;
        }
      }
      function noiseBuffer(ctx, seconds) {
        var len = Math.max(1, Math.ceil(ctx.sampleRate * seconds));
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        return buf;
      }
      function playClick() {
        if (Lab.muted) return;
        try {
          var ctx = audio();
          if (!ctx) return;
          var t = ctx.currentTime;
          var master = ctx.createGain();
          master.gain.value = .22;
          master.connect(ctx.destination);
          var tick = ctx.createBufferSource();
          tick.buffer = noiseBuffer(ctx, .01);
          var hp = ctx.createBiquadFilter();
          hp.type = 'bandpass';
          hp.frequency.value = 5200;
          hp.Q.value = 1.5;
          var tickEnv = ctx.createGain();
          tickEnv.gain.setValueAtTime(.8, t);
          tickEnv.gain.exponentialRampToValueAtTime(.001, t + .02);
          tick.connect(hp);
          hp.connect(tickEnv);
          tickEnv.connect(master);
          tick.start(t);
          var notes = [[1046.5, 0], [1568, .05]];
          notes.forEach(function (n) {
            var osc = ctx.createOscillator();
            var env = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n[0], t + n[1]);
            env.gain.setValueAtTime(.0001, t + n[1]);
            env.gain.exponentialRampToValueAtTime(1, t + n[1] + .006);
            env.gain.exponentialRampToValueAtTime(.001, t + n[1] + .11);
            osc.connect(env);
            env.connect(master);
            osc.start(t + n[1]);
            osc.stop(t + n[1] + .12);
          });
        } catch (err) {}
      }
      var hiss = null;
      function startHiss() {
        if (Lab.muted || hiss) return;
        try {
          var ctx = audio();
          if (!ctx) return;
          var src = ctx.createBufferSource();
          src.buffer = noiseBuffer(ctx, 1.5);
          src.loop = true;
          var band = ctx.createBiquadFilter();
          band.type = 'bandpass';
          band.frequency.value = 2400;
          band.Q.value = .4;
          var gain = ctx.createGain();
          gain.gain.setValueAtTime(.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.05, ctx.currentTime + .12);
          src.connect(band);
          band.connect(gain);
          gain.connect(ctx.destination);
          src.start();
          hiss = { src: src, gain: gain, ctx: ctx };
        } catch (err) {}
      }
      function stopHiss() {
        if (!hiss) return;
        var h = hiss;
        hiss = null;
        try {
          var t = h.ctx.currentTime;
          h.gain.gain.cancelScheduledValues(t);
          h.gain.gain.setValueAtTime(h.gain.gain.value || .05, t);
          h.gain.gain.exponentialRampToValueAtTime(.0001, t + .16);
          h.src.stop(t + .18);
        } catch (err) {}
      }
      function applySink(c, g, dy) {
        setPos(c, g.x, g.y + dy);
        c.style.clipPath = 'inset(0 0 ' + (Math.max(0, dy) / g.sc).toFixed(2) + 'px 0)';
      }
      function drawStatic(el) {
        var w = Math.max(1, Math.ceil(window.innerWidth / 3));
        var h = Math.max(1, Math.ceil(window.innerHeight / 3));
        el.width = w;
        el.height = h;
        var ctx = el.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        var img = ctx.createImageData(w, h);
        var px = new Uint32Array(img.data.buffer);
        var bar = Math.max(4, Math.round(h * .14));
        var last = 0;
        function frame(now) {
          staticRaf = requestAnimationFrame(frame);
          if (now - last < 1000 / 24) return;
          last = now;
          for (var i = 0; i < px.length; i++) px[i] = 0xff000000 | (30 + (Math.random() * 200 | 0)) * 0x010101;
          ctx.putImageData(img, 0, 0);
          ctx.fillStyle = 'rgba(255, 255, 255, .08)';
          ctx.fillRect(0, ((now * .12) % (h + bar)) - bar, w, bar);
        }
        staticRaf = requestAnimationFrame(frame);
      }
      function showStatic() {
        var el = document.createElement('canvas');
        el.className = 'lab-static';
        document.body.appendChild(el);
        staticEl = el;
        document.body.classList.add('lab-static-on');
        startHiss();
        if (Lab.reducedMotion) {
          el.classList.add('is-plain', 'is-in');
          return;
        }
        drawStatic(el);
        void el.offsetWidth;
        el.classList.add('is-in');
      }
      function hideStatic() {
        if (!staticEl) return;
        stopHiss();
        staticEl.classList.add('is-out');
        staticEl.classList.remove('is-in');
      }
      function clearStatic() {
        cancelAnimationFrame(staticRaf);
        staticRaf = 0;
        stopHiss();
        document.body.classList.remove('lab-static-on');
        if (staticEl) staticEl.remove();
        staticEl = null;
      }
      function clearSeq() {
        cancelAnimationFrame(seqRaf);
        seqRaf = 0;
        clearStatic();
        document.body.classList.remove('lab-seq');
      }
      function finishEject(it) {
        var c = it.cart;
        c.classList.remove('is-flying', 'lab-fly', 'lab-sink');
        c.style.clipPath = '';
        cons.reset();
        document.body.classList.remove('lab-seq');
        it.busy = false;
        settle(it);
      }
      function flyBack(it) {
        var c = it.cart;
        c.style.clipPath = '';
        lower();
        c.style.setProperty('--cart-transform', PEEK_TRANSFORM);
        if (Lab.reducedMotion) {
          setPos(c, 0, 0);
          later(function () { finishEject(it); }, 0);
          return;
        }
        c.classList.remove('lab-sink');
        c.classList.add('lab-fly');
        setPos(c, 0, 0);
        later(function () { finishEject(it); }, SEQ.fly);
      }
      function eject(it, g) {
        var c = it.cart;
        if (Lab.reducedMotion) {
          applySink(c, g, 0);
          flyBack(it);
          return;
        }
        tween(SEQ.lift, function (k) { applySink(c, g, g.d * (1 - k) * (1 - k)); }, function () { flyBack(it); });
      }
      function launch(it, g) {
        Lab.launch(it.game);
        later(function () {
          hideStatic();
          later(function () {
            clearStatic();
            eject(it, g);
          }, Lab.reducedMotion ? 0 : SEQ.fadeOut);
        }, SEQ.linger);
      }
      function powerUp(it, g) {
        cons.setHot(false);
        cons.power(true);
        later(function () {
          showStatic();
          later(function () { launch(it, g); }, Lab.reducedMotion ? SEQ.plain : SEQ.fadeIn + SEQ.run);
        }, SEQ.hold);
      }
      function insertCart(it, g) {
        var c = it.cart;
        flatTilt(c);
        c.classList.remove('lab-fly');
        c.classList.add('lab-sink');
        if (Lab.reducedMotion) {
          applySink(c, g, g.d);
          playClick();
          powerUp(it, g);
          return;
        }
        tween(SEQ.sink, function (k) { applySink(c, g, g.d * k * k); }, function () {
          playClick();
          tween(SEQ.settle, function (k) { applySink(c, g, g.d + 2 * Math.sin(Math.PI * k)); }, function () {
            applySink(c, g, g.d);
            powerUp(it, g);
          });
        });
      }
      function sink(it) {
        var c = it.cart;
        it.busy = true;
        flatTilt(c);
        if (!Lab.muted) audio();
        document.body.classList.add('lab-seq');
        var a = c.getBoundingClientRect();
        var b = seat.getBoundingClientRect();
        var p = getPos(c);
        var sc = b.width / c.offsetWidth;
        var h = c.offsetHeight * sc;
        var g = {
          x: p.x + (b.left + b.width / 2) - (a.left + a.width / 2),
          y: p.y + b.bottom - (a.top + a.height / 2 + h / 2),
          sc: sc,
          d: h * SINK_FRACTION
        };
        c.classList.add('is-flying');
        c.style.setProperty('--cart-transform', 'scale(' + sc.toFixed(4) + ')');
        if (Lab.reducedMotion) {
          setPos(c, g.x, g.y);
          insertCart(it, g);
          return;
        }
        c.classList.add('lab-fly');
        setPos(c, g.x, g.y);
        later(function () { insertCart(it, g); }, SEQ.fly);
      }
      function insert(it) {
        if (!it.cart || it.busy || (cur && cur !== it)) return;
        if (!cons || !seat) { Lab.toast('No console skin registered'); return; }
        cur = it;
        it.busy = true;
        it.el.classList.add('is-active');
        var wait = dock.classList.contains('is-up') ? 0 : Lab.reducedMotion ? 220 : 580;
        lift();
        later(function () {
          it.busy = false;
          sink(it);
        }, wait);
      }
      function reset() {
        timers.forEach(clearTimeout);
        timers = [];
        clearSeq();
        cur = null;
        lower();
        if (cons) cons.reset();
        items.forEach(function (it) {
          it.held = false;
          it.busy = false;
          it.dragging = false;
          if (it.cart) {
            it.cart.classList.remove('is-flying', 'is-spring', 'is-dragging', 'lab-fly', 'lab-sink', 'lab-grow');
            it.cart.style.clipPath = '';
            it.cart.style.setProperty('--cart-transform', PEEK_TRANSFORM);
            setPos(it.cart, 0, 0);
            flatTilt(it.cart);
          }
          it.el.classList.remove('is-active', 'is-peek');
        });
      }
      function mountCart(it) {
        if (it.destroy) it.destroy();
        if (it.cart) it.cart.remove();
        it.cart = null;
        it.destroy = null;
        var skin = byId(Lab.cartSkins, sel.cart);
        if (!skin) return;
        var cart;
        try {
          cart = skin.build(it.game);
        } catch (err) {
          return;
        }
        cart.style.setProperty('--cart-color', it.game.color);
        cart.tabIndex = 0;
        cart.setAttribute('role', 'button');
        cart.setAttribute('aria-label', 'Insert ' + it.game.title + ' cartridge');
        cart.style.setProperty('--cart-transform', PEEK_TRANSFORM);
        Lab.tilt(cart);
        it.peek.appendChild(cart);
        it.cart = cart;
        it.destroy = Lab.drag(cart, {
          slotEl: { getBoundingClientRect: function () { if (!slot) return { left: 0, right: 0, top: 0, bottom: 0 }; var s = slot.getBoundingClientRect(); var r = cons.getBoundingClientRect(); return { left: r.left, right: r.right, top: r.top - 140, bottom: s.bottom + 24 }; } },
          onStart: function () {
            it.dragging = true;
            cur = it;
            flatTilt(cart);
            it.el.classList.add('is-active');
            cart.classList.add('lab-grow');
            cart.style.setProperty('--cart-transform', 'scale(1)');
            later(function () { cart.classList.remove('lab-grow'); }, 200);
            lift();
          },
          onSpring: function () {
            cart.style.setProperty('--cart-transform', PEEK_TRANSFORM);
          },
          onHover: function (h) { if (cons) cons.setHot(h); },
          onDrop: function () {
            if (cons) cons.setHot(false);
            if (it.dragging) {
              it.dragging = false;
              if (!cons || !seat) { Lab.toast('No console skin registered'); return; }
              sink(it);
            } else {
              insert(it);
            }
          },
          onMiss: function () {
            it.dragging = false;
            later(function () {
              lower();
              settle(it);
            }, 200);
          }
        }).destroy;
      }
      function buildItem(game) {
        var el = document.createElement('div');
        el.className = 'lab-item';
        el.innerHTML = Lab.cardHTML(game) + '<div class="lab-peek"></div>';
        var it = { el: el, game: game, peek: el.querySelector('.lab-peek'), cart: null, held: false, busy: false, dragging: false };
        el.addEventListener('pointerenter', function (e) {
          if (e.pointerType === 'mouse') { it.held = true; peek(it, true); }
        });
        el.addEventListener('pointerleave', function (e) {
          if (e.pointerType === 'mouse') { it.held = false; if (!cur) peek(it, false); }
        });
        el.addEventListener('focusin', function () {
          it.held = true;
          peek(it, true);
        });
        el.addEventListener('focusout', function (e) {
          if (!el.contains(e.relatedTarget)) { it.held = false; if (!cur) peek(it, false); }
        });
        mountCart(it);
        return it;
      }
      function fitDock() {
        if (!cons) return;
        var s = Math.min(1.25, (window.innerWidth - 24) / cons.offsetWidth);
        cons.style.transform = 'scale(' + s.toFixed(3) + ')';
      }
      function mountConsole() {
        dock.innerHTML = '';
        cons = null;
        slot = null;
        seat = null;
        var skin = byId(Lab.consoleSkins, sel.console);
        if (!skin) return;
        try {
          cons = Lab.attachConsole(skin.build());
        } catch (err) {
          cons = null;
          return;
        }
        dock.appendChild(cons);
        slot = cons.querySelector('.console-slot');
        seat = cons.querySelector('.console-seat') || slot;
        fitDock();
      }
      function fitConsoleTiles() {
        fits.forEach(function (f) {
          var w = f.stage.clientWidth - 16;
          var cw = f.cons.offsetWidth;
          var s = Math.min(1, w / cw);
          f.cons.style.transform = 'scale(' + s.toFixed(3) + ')';
          f.box.style.width = Math.round(cw * s) + 'px';
          f.box.style.height = Math.round(f.cons.offsetHeight * s) + 'px';
        });
      }
      function markSelected(host, id) {
        Array.prototype.forEach.call(host.querySelectorAll('.lab-tile'), function (t) {
          var on = t.dataset.id === id;
          t.classList.toggle('is-selected', on);
          t.setAttribute('aria-pressed', String(on));
        });
      }
      function makeTile(skin, stageClass) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'lab-tile';
        b.dataset.id = skin.id;
        b.setAttribute('aria-pressed', 'false');
        b.innerHTML = '<div class="stage ' + (stageClass || '') + '"></div><span class="lab-tile-name"></span><span class="lab-tile-note"></span>';
        b.querySelector('.lab-tile-name').textContent = String(numOf(skin.id)).padStart(2, '0') + ' ' + skin.name;
        b.querySelector('.lab-tile-note').textContent = skin.note;
        return b;
      }
      function empty(host) { host.innerHTML = '<p class="lab-empty">No skins registered</p>'; }
      function renderCartGallery() {
        cartHost.innerHTML = '';
        if (!Lab.cartSkins.length) return empty(cartHost);
        Lab.cartSkins.forEach(function (skin) {
          Lab.games.forEach(function (game) {
            var tile = makeTile(skin);
            tile.querySelector('.lab-tile-name').textContent = skin.name;
            tile.querySelector('.lab-tile-note').textContent = game.title;
            var stage = tile.querySelector('.stage');
            try {
              var cart = skin.build(game);
              cart.style.setProperty('--cart-color', game.color);
              cart.classList.add('cart--float');
              stage.appendChild(cart);
              Lab.tilt(cart, tile);
            } catch (err) {
              stage.textContent = 'Build failed';
            }
            tile.addEventListener('click', function () { chooseCart(skin.id); });
            cartHost.appendChild(tile);
          });
        });
        markSelected(cartHost, sel.cart);
      }
      function renderConsoleGallery() {
        consoleHost.innerHTML = '';
        fits = [];
        if (!Lab.consoleSkins.length) return empty(consoleHost);
        Lab.consoleSkins.forEach(function (skin) {
          var tile = makeTile(skin, 'lab-console-stage');
          var stage = tile.querySelector('.stage');
          var box = document.createElement('div');
          box.className = 'lab-fit';
          stage.appendChild(box);
          try {
            var c = skin.build();
            box.appendChild(c);
            fits.push({ stage: stage, box: box, cons: c });
          } catch (err) {
            stage.textContent = 'Build failed';
          }
          tile.addEventListener('click', function () { chooseConsole(skin.id); });
          consoleHost.appendChild(tile);
        });
        markSelected(consoleHost, sel.console);
        fitConsoleTiles();
      }
      function chooseCart(id) {
        sel.cart = id;
        reset();
        items.forEach(mountCart);
        markSelected(cartHost, id);
        syncReadout();
      }
      function chooseConsole(id) {
        sel.console = id;
        reset();
        mountConsole();
        markSelected(consoleHost, id);
        syncReadout();
      }
      function init() {
        var c = byId(Lab.cartSkins, 'ck-1') || Lab.cartSkins[0];
        var k = byId(Lab.consoleSkins, 'cs-1') || Lab.consoleSkins[0];
        sel.cart = c ? c.id : null;
        sel.console = k ? k.id : null;
        mountConsole();
        items = Lab.games.map(buildItem);
        items.forEach(function (it) { grid.appendChild(it.el); });
        renderCartGallery();
        renderConsoleGallery();
        syncReadout();
      }
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') reset();
      });
      document.addEventListener('pointerdown', function (e) {
        if (Lab.coarse && !cur && !e.target.closest('.lab-item')) reset();
      });
      var frame = 0;
      window.addEventListener('resize', function () {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(function () {
          fitDock();
          fitConsoleTiles();
        });
      });
      init();
    })();
  </script>
</body>
</html>
