<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook message interactions</title>
<script src="/demo-system/demo-system.js?v=4"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<link rel="stylesheet" href="/demo-system/demo-system.css?v=2">
<link rel="stylesheet" href="./cell-animation.css?v=8">
<link rel="stylesheet" href="./message-animation.css?v=9">
</head>
<body class="demo-scene demo-scene--notebook" data-demo-scene="notebook">

<div class="frame">
<div class="notebook" id="notebook"></div>

<div class="sel-actions" id="selActions">
  <button id="chatBtn"><span class="msym">chat_paste_go</span>Chat</button>
  <button id="modifyBtn"><span class="msym">edit_note</span>Modify</button>
  <button id="explainBtn"><span class="msym">help</span>Explain</button>
</div>

<div class="chat" id="chat">
  <div class="hero show" id="hero">
    <div class="hero-title"><span class="hero-hi">Hello,</span> <span class="hero-name">Miguel</span></div>
    <div class="hero-sub">How can I help you?</div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-input" id="chatInput">
    <div class="chat-chip" id="chatChip">
      <span class="msym chat-chip-icon">code</span>
      <span class="chat-chip-label" id="chatChipLabel"></span>
      <span class="msym chat-chip-close">close</span>
    </div>
    <div class="chat-input-row">
      <span class="msym add-btn">add</span>
      <div class="chat-input-text"><span id="inputText"></span><span class="placeholder" id="placeholder">What can I help you build?</span></div>
      <span class="model">Gemini Pro<span class="msym">arrow_drop_down</span></span>
      <span class="msym send-btn" id="sendBtn">send</span>
    </div>
  </div>
  <div class="chat-chips show" id="chatChips">
    <button>Generate a plot</button>
    <button id="datasetChip">Load a public dataset</button>
    <button>Import Gemini API</button>
  </div>
</div>
</div>

<div class="mouse" id="mouse">
  <span class="ripple"></span>
  <svg width="22" height="22" viewBox="0 0 24 24">
    <path d="M5.2 2.8v16.9l4.1-3.6 2.5 5.8 2.9-1.2-2.5-5.7 5.5-.6z"
          fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
</div>

<script src="./message-animation.js?v=9"></script>
</body>
</html>
