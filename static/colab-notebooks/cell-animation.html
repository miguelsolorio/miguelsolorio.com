<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook cell generation</title>
<script src="/demo-system/demo-system.js?v=3"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<link rel="stylesheet" href="/demo-system/demo-system.css?v=2">
<link rel="stylesheet" href="./cell-animation.css?v=8">
</head>
<body class="demo-scene demo-scene--notebook" data-demo-scene="notebook">

<div class="frame">
<div class="notebook" id="notebook"></div>

<div class="chat" id="chat">
  <div class="chat-msg chat-user" id="chatUser">
    <span class="avatar"><img src="/avatar.png" alt="" ></span>
    <span class="chat-user-text" id="chatUserText"></span>
  </div>
  <div class="chat-msg chat-ai" id="chatAi">
    <svg class="chat-spark" width="22" height="22" viewBox="0 0 24 24" fill="#4285f4"><path d="M12 1.5c.6 5.7 4.8 9.9 10.5 10.5C16.8 12.6 12.6 16.8 12 22.5 11.4 16.8 7.2 12.6 1.5 12 7.2 11.4 11.4 7.2 12 1.5z"/></svg>
    <span class="msym chat-spinner">progress_activity</span>
    <div class="chat-ai-body">
      <span class="chat-ai-text" id="chatAiText"></span>
      <div class="chat-actions" id="chatActions">
        <button id="acceptRunBtn"><span class="msym">play_arrow</span>Accept &amp; Run</button>
        <button><span class="msym">check</span>Accept</button>
        <button><span class="msym">close</span>Cancel</button>
      </div>
    </div>
  </div>
  <div class="chat-input" id="chatInput">
    <div class="chat-input-row">
      <span class="msym add-btn">add</span>
      <div class="chat-input-text"><span id="inputText"></span><span class="placeholder" id="placeholder">What can I help you build?</span></div>
      <span class="model">Gemini Pro<span class="msym">arrow_drop_down</span></span>
      <span class="msym send-btn" id="sendBtn">send</span>
    </div>
  </div>
</div>
</div>

<div class="mouse" id="mouse">
  <span class="ripple"></span>
  <svg width="22" height="22" viewBox="0 0 24 24">
    <path d="M5.2 2.8v16.9l4.1-3.6 2.5 5.8 2.9-1.2-2.5-5.7 5.5-.6z"
          fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
</div>

<script src="./cell-animation.js"></script>
</body>
</html>
