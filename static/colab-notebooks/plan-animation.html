<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook plan mode</title>
<script src="/demo-system/demo-system.js?v=2"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<link rel="stylesheet" href="/demo-system/demo-system.css?v=2">
<link rel="stylesheet" href="./cell-animation.css?v=8">
<link rel="stylesheet" href="./message-animation.css?v=7">
<link rel="stylesheet" href="./plan-animation.css?v=6">
</head>
<body class="demo-scene demo-scene--notebook" data-demo-scene="notebook">

<div class="frame">
<div class="notebook" id="notebook"></div>

<div class="chat" id="chat">
  <!-- the landing starts open: run() removes and re-adds .show in one task, so
       a collapsed starting point is what makes the hero animate in on the first
       play only, and sit still on every replay after it -->
  <div class="hero show" id="hero">
    <div class="hero-title"><span class="hero-hi">Hello,</span> <span class="hero-name">Miguel</span></div>
    <div class="hero-sub">How can I help you?</div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-input" id="chatInput">
    <!-- anchored above the composer; typing "/" reveals it -->
    <div class="slash-menu" id="slashMenu">
      <button id="menuPlan">
        <span class="msym">checklist</span>
        <span class="slash-text"><span class="slash-label">Plan</span><span class="slash-desc">Generate a plan</span></span>
      </button>
      <button id="menuLearn">
        <span class="msym">school</span>
        <span class="slash-text"><span class="slash-label">Learn</span><span class="slash-desc">Guided learning</span></span>
      </button>
      <button id="menuViz">
        <span class="msym">monitoring</span>
        <span class="slash-text"><span class="slash-label">Visualize</span><span class="slash-desc">Create visualizations</span></span>
      </button>
    </div>
    <div class="chat-chip chat-chip--mode" id="chatChip">
      <span class="msym chat-chip-icon">checklist</span>
      <span class="chat-chip-label" id="chatChipLabel">Plan</span>
      <span class="msym chat-chip-close">close</span>
    </div>
    <div class="chat-input-row">
      <span class="msym add-btn">add</span>
      <div class="chat-input-text"><span id="inputText"></span><span class="placeholder" id="placeholder">What can I help you build?</span></div>
      <span class="model">Gemini Pro<span class="msym">arrow_drop_down</span></span>
      <span class="msym send-btn" id="sendBtn">send</span>
    </div>
  </div>
  <div class="chat-chips show" id="chatChips">
    <button>Generate a plot</button>
    <button id="datasetChip">Load a public dataset</button>
    <button>Import Gemini API</button>
  </div>
</div>
</div><!-- /.frame -->

<div class="mouse" id="mouse">
  <span class="ripple"></span>
  <svg width="22" height="22" viewBox="0 0 24 24">
    <path d="M5.2 2.8v16.9l4.1-3.6 2.5 5.8 2.9-1.2-2.5-5.7 5.5-.6z"
          fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
</div>

<script src="./plan-animation.js?v=5"></script>
</body>
</html>
