[build]
  publish = "public"
  command = "npm run export"

[build.environment]
  HUGO_VERSION = "0.115.2"
  NODE_VERSION = "18"

# Production is the only context that may be indexed.
[context.production]
  command = "npm run export"

# Branch deploys and deploy previews build with a non-production Hugo
# environment (`-e preview`), which flips the robots.txt template and the
# <meta name="robots"> tag to noindex. The generated `_headers` file adds an
# X-Robots-Tag on every response as a second layer, since crawlers that never
# fetch robots.txt still honor the header.
[context.branch-deploy]
  command = "hugo --minify --cleanDestinationDir -e preview && printf '/*\\n  X-Robots-Tag: noindex, nofollow, noarchive, nosnippet\\n' > public/_headers"

[context.deploy-preview]
  command = "hugo --minify --cleanDestinationDir -e preview && printf '/*\\n  X-Robots-Tag: noindex, nofollow, noarchive, nosnippet\\n' > public/_headers"
