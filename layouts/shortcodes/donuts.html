{{- if not (strings.Trim .Inner " \t\r\n") -}}
  {{- errorf "donuts shortcode in %s: needs {{< donut >}} calls between its opening and closing tags" $.Page.File.Path -}}
{{- end -}}
<figure class="donut-board">
  {{- with .Get "alt" }}
  <p class="sr-only">{{ . }}</p>
  {{- end }}
  <div class="donut-row">
{{ .Inner }}
  </div>
  {{- with .Get "caption" }}
  <figcaption class="donut-caption">{{ . }}</figcaption>
  {{- end }}
</figure>
