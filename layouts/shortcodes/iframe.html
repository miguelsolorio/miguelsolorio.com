{{ $src := .Get "src" }}
{{ $height := .Get "height" | default "700" }}
{{ $title := .Get "title" }}
{{ $frameClass := .Get "frame_class" }}
{{ if $frameClass }}<div class="{{ $frameClass }}">{{ end }}
<iframe class="embed-frame" src="{{ $src }}" title="{{ $title }}" height="{{ $height }}" loading="lazy" scrolling="no" style="width: 100%; border: 0; border-radius: 12px;"></iframe>
{{ if $frameClass }}</div>{{ end }}
