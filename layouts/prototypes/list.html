<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototypes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      body {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 2rem;
      }

      ul {
        display: grid;
        gap: .75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: block;
        padding: .875rem 1rem;
        color: #1d4ed8;
        border: 1px solid #dbeafe;
        border-radius: .5rem;
        background: #fff;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: #93c5fd;
        background: #eff6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Prototypes</h1>
      <ul>
        {{ range sort (readDir "static/prototypes") "Name" }}
          {{ if and (not .IsDir) (ne .Name "index.html") }}
            <li><a href="./{{ .Name }}">{{ .Name }}</a></li>
          {{ end }}
        {{ end }}
      </ul>
    </main>
  </body>
</html>
